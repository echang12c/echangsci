# Publica os dois sites no Cloudflare Pages.
#   push no Main          -> site principal (seucofrin.pages.dev, ericzin.pages.dev)
#   push em outro branch  -> site de teste  (teste.seucofrin.pages.dev, teste.ericzin.pages.dev)
# Precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID no repositório.
name: Publicar no Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref_name == 'Main' && 'principal' || 'teste' }}
  cancel-in-progress: false

env:
  # "main" é o branch de produção no Cloudflare; qualquer outro nome vira o alias <nome>.<projeto>.pages.dev
  DESTINO: ${{ github.ref_name == 'Main' && 'main' || 'teste' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LifePlan vai sem a pasta tools/
      - name: Preparar LifePlan
        run: |
          mkdir -p dist
          cp -r ericzin-life-plan dist/lifeplan
          rm -rf dist/lifeplan/tools

      - name: Publicar seucofrin (${{ env.DESTINO }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy meucofrin --project-name seucofrin --branch ${{ env.DESTINO }} --commit-dirty=true

      - name: Publicar ericzin (${{ env.DESTINO }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/lifeplan --project-name ericzin --branch ${{ env.DESTINO }} --commit-dirty=true
