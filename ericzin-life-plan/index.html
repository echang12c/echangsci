<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ericzin's Life Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --sidebar-w:232px;
    /* neutral scale */
    --n-50:#f9fafb; --n-100:#f3f4f6; --n-200:#e5e7eb; --n-300:#d1d5db;
    --n-400:#9ca3af; --n-500:#6b7280; --n-600:#4b5563; --n-700:#374151;
    --n-800:#1f2937; --n-900:#111827;
    /* brand purple */
    --primary:#8570fd;
    --primary-hover:#6349f8;
    --primary-500:#bcb0fc;
    --primary-light:#ece9ff;

    --bg:var(--n-50);
    --surface:#ffffff;
    --surface-2:var(--n-100);
    --border:var(--n-200);
    --border-strong:var(--n-300);
    --text:var(--n-900);
    --text-2:var(--n-500);
    --success-bg:#e2f9ec;
    --success-text:#0f9d58;
    --warn-bg:var(--primary-light);
    --warn-text:var(--primary-hover);
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 20px -12px rgba(17,24,39,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:var(--n-900);
      --surface:var(--n-800);
      --surface-2:var(--n-700);
      --border:#37415130;
      --border-strong:var(--n-600);
      --text:var(--n-50);
      --text-2:var(--n-400);
      --primary:#9c8bff;
      --primary-hover:#7c63fb;
      --primary-500:#bcb0fc;
      --primary-light:#2a2154;
      --success-bg:#123527;
      --success-text:#6ee6a4;
      --warn-bg:var(--primary-light);
      --warn-text:#c9bdff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:var(--n-900);
    --surface:var(--n-800);
    --surface-2:var(--n-700);
    --border:#37415130;
    --border-strong:var(--n-600);
    --text:var(--n-50);
    --text-2:var(--n-400);
    --primary:#9c8bff;
    --primary-hover:#7c63fb;
    --primary-500:#bcb0fc;
    --primary-light:#2a2154;
    --success-bg:#123527;
    --success-text:#6ee6a4;
    --warn-bg:var(--primary-light);
    --warn-text:#c9bdff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito', system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  h1,h2,h3{ font-family:'Baloo 2', system-ui, sans-serif; font-weight:700; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }

  .app{ min-height:100dvh; }

  /* ---------- Sidebar (always fixed to the left) ---------- */
  .sidebar{
    width:var(--sidebar-w);
    background:linear-gradient(190deg, var(--n-900) 0%, var(--n-800) 100%);
    color:var(--n-300);
    display:flex;
    flex-direction:column;
    padding:20px 14px calc(18px + env(safe-area-inset-bottom,0px));
    gap:6px;
    position:fixed;
    left:0;
    top:0;
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    z-index:10;
    isolation:isolate;
  }
  .sidebar::before{
    content:''; position:absolute; z-index:-1; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, var(--primary) 0%, transparent 70%); opacity:.22;
    top:-70px; right:-90px; filter:blur(4px);
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 18px; }
  .brand-mark{ width:38px; height:38px; flex:none; }
  .brand-text .name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; line-height:1.1; color:#fff; white-space:nowrap; }
  .brand-text .who{ font-size:11.5px; color:var(--n-400); margin-top:2px; white-space:nowrap; font-weight:600; }

  .nav-label{ font-size:10.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--n-500); padding:14px 10px 6px; white-space:nowrap; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    border:none; background:transparent; color:var(--n-300);
    padding:10px 12px; border-radius:14px; cursor:pointer;
    font-size:13.5px; font-family:'Nunito', sans-serif; font-weight:700; text-align:left;
    transition: background .15s, color .15s, transform .15s;
  }
  .nav-item .ico{ width:19px; height:19px; flex:none; display:flex; }
  .nav-item .ico svg{ width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item .nav-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; transform:translateX(2px); }
  .nav-item.active{ background:var(--primary); color:#fff; box-shadow:0 4px 12px -2px rgba(133,112,253,.55); }
  .nav-item.active .ico{ color:#fff; }

  .sidebar-bottom{ margin-top:auto; }
  .account-row{ padding-top:14px; margin-bottom:12px; border-top:1px solid rgba(255,255,255,.12); display:flex; align-items:center; gap:10px; }
  .account-avatar{ width:32px; height:32px; border-radius:50%; flex:none; background:var(--n-700); }
  .account-info{ min-width:0; }
  .account-name{ font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .account-signout{ border:none; background:none; padding:0; color:var(--n-400); font-size:11px; font-weight:700; cursor:pointer; }
  .account-signout:hover{ color:#fff; text-decoration:underline; }
  .account-row[hidden] + .sidebar-foot{ border-top:1px solid rgba(255,255,255,.12); }

  .sidebar-foot{
    padding-top:14px;
  }

  .auth-overlay{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{ width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:2rem 1.75rem; }
  .google-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    border:2px solid var(--border-strong); background:var(--surface); color:var(--text);
    font-weight:800; font-size:13.5px; padding:11px 16px; border-radius:14px; cursor:pointer;
  }
  .google-btn:hover{ border-color:var(--primary); }
  .auth-note{ text-align:center; font-size:12px; color:var(--text-2); margin-top:14px; min-height:1em; }
  .foot-stat-label{ font-size:10.5px; color:var(--n-500); font-weight:800; text-transform:uppercase; letter-spacing:.07em; white-space:nowrap; }
  .foot-stat-value{ font-family:'Baloo 2', sans-serif; font-size:24px; font-weight:700; color:#fff; margin-top:3px; }
  .foot-bar{ height:8px; border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden; margin-top:8px; }
  .foot-bar-fill{ height:100%; background:linear-gradient(90deg, var(--primary-500), var(--primary)); border-radius:5px; }

  /* ---------- Main ---------- */
  .main{ margin-left:var(--sidebar-w); min-width:0; padding:2rem clamp(16px, 4vw, 2.75rem) 3rem; }
  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--primary-hover); margin-bottom:6px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:1.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .page-head h1{ font-size:29px; color:var(--text); }
  .page-sub{ color:var(--text-2); font-size:13.5px; margin-top:6px; max-width:52ch; font-weight:600; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; border:none; background:none; color:var(--primary-hover); font-weight:800; font-size:12.5px; cursor:pointer; padding:0; margin-bottom:10px; }
  .back-link:hover{ text-decoration:underline; }

  /* overview hero card */
  .hero-card{
    background:var(--surface); border:1px solid var(--border); border-radius:22px;
    box-shadow:var(--shadow); padding:1.5rem 1.75rem; display:flex; justify-content:space-between;
    align-items:center; gap:1.5rem; flex-wrap:wrap; margin-bottom:1.75rem;
    border-bottom:4px solid var(--primary);
  }
  .hero-label{ font-size:12px; color:var(--text-2); font-weight:700; margin-bottom:8px; }
  .hero-value{ font-family:'Baloo 2', sans-serif; font-size:44px; font-weight:700; color:var(--primary-hover); line-height:1; }
  .hero-value .of{ font-size:20px; color:var(--text-2); font-weight:600; }
  .hero-meta{ text-align:right; font-size:12.5px; color:var(--text-2); font-weight:600; }
  .hero-meta .date{ color:var(--text); font-weight:800; margin-bottom:2px; }
  .hero-chip{ display:inline-block; margin-top:6px; font-size:11px; font-weight:800; color:var(--warn-text); background:var(--warn-bg); padding:4px 11px; border-radius:100px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:14px; }

  .pillar-card{
    background:var(--surface); border:2px solid var(--border); border-radius:20px; padding:1.15rem 1.25rem;
    cursor:pointer; text-align:left; box-shadow:var(--shadow); border-bottom:5px solid var(--accent);
    display:flex; flex-direction:column; gap:10px; transition:transform .15s, box-shadow .15s;
  }
  .pillar-card:hover{ transform:translateY(-3px) rotate(-0.4deg); border-color:var(--border-strong); }
  .pillar-top{ display:flex; align-items:center; gap:10px; }
  .pillar-ico{ width:34px; height:34px; border-radius:12px; background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
  .pillar-ico svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .pillar-name{ font-family:'Baloo 2', sans-serif; font-weight:600; font-size:15px; color:var(--text); }
  .pillar-metric{ font-size:12.5px; color:var(--text-2); font-weight:700; }
  .pillar-bar{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .pillar-bar-fill{ height:100%; background:var(--accent); border-radius:5px; }

  /* pillar detail */
  .detail-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:1.25rem; align-items:start; }
  @media (max-width: 760px){ .detail-grid{ grid-template-columns:1fr; } }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:1.25rem 1.4rem; box-shadow:var(--shadow); }
  .card + .card{ margin-top:1.1rem; }
  .card-title{ font-family:'Baloo 2', sans-serif; font-size:13.5px; font-weight:600; color:var(--primary-hover); margin-bottom:12px; }
  .chart-wrap{ position:relative; height:190px; }
  .chart-empty{ height:190px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--text-2); font-size:13px; font-weight:700; padding:0 1rem; background:var(--surface-2); border-radius:16px; }

  .habit-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:2px dashed var(--border); }
  .habit-row:last-child{ border-bottom:none; }
  .habit-row input{ width:19px; height:19px; accent-color:var(--accent-pillar, var(--primary)); flex:none; }
  .habit-row label{ font-size:13.5px; color:var(--text); font-weight:700; flex:1; }
  .habit-row.done label{ color:var(--text-2); text-decoration:line-through; }

  .checkin-box textarea{
    width:100%; min-height:88px; resize:vertical; font-family:inherit; font-size:13px; color:var(--text);
    background:var(--surface-2); border:2px solid var(--border); border-radius:16px; padding:10px 14px;
  }
  .save-note{ font-size:11px; color:var(--text-2); margin-top:6px; display:flex; align-items:center; gap:5px; font-weight:700; }
  .save-note .dot-ok{ width:7px; height:7px; border-radius:50%; background:var(--success-text); }

  .tip-box{ background:var(--warn-bg); color:var(--warn-text); border-radius:16px; padding:.9rem 1rem; font-size:12.5px; font-weight:600; line-height:1.5; }
  .tip-box strong{ color:inherit; }

  .obj-line{ font-size:13.5px; color:var(--text-2); margin-top:4px; }
  .obj-line strong{ color:var(--text); }

  /* ---------- Custom pillar page components ---------- */
  .pillar-body{ display:block; }
  .day-toggle-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .day-toggle{
    flex:1; min-width:36px; aspect-ratio:1; border-radius:12px; border:2px solid var(--border);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-weight:800; font-size:10.5px; color:var(--text-2); transition:background .15s, border-color .15s, color .15s;
  }
  .day-toggle .dow{ letter-spacing:.02em; }
  .day-toggle.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .day-toggle.today{ box-shadow:0 0 0 2px var(--accent) inset; }
  .day-toggle.on.today{ box-shadow:0 0 0 2px var(--surface) inset; }

  .meta-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; font-weight:700; color:var(--text-2); margin:12px 0 6px; }
  .meta-row strong{ color:var(--text); }
  .mini-bar{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .mini-bar-fill{ height:100%; border-radius:5px; background:var(--accent); }

  .chart-card-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; font-size:11.5px; font-weight:700; color:var(--text-2); }

  .stat-duo{ display:grid; grid-template-columns:1fr 1fr; gap:1.1rem; }
  @media (max-width:520px){ .stat-duo{ grid-template-columns:1fr; } }
  .stat-number-card.clickable{ cursor:pointer; }
  .stat-number{ font-family:'Baloo 2', sans-serif; font-size:36px; font-weight:700; color:var(--accent); line-height:1; }
  .stat-number-label{ font-size:12.5px; color:var(--text-2); font-weight:700; margin-top:4px; }

  .record-add{ display:flex; gap:8px; margin-bottom:10px; }
  .record-add input{ flex:1; }
  .record-add button, .boost-btn{ border:2px solid var(--accent); background:transparent; color:var(--accent); font-weight:800; font-size:12px; padding:0 14px; border-radius:12px; cursor:pointer; white-space:nowrap; transition:background .15s, color .15s; }
  .record-add button:hover, .boost-btn:hover{ background:var(--accent); color:#fff; }
  .record-list{ display:flex; flex-direction:column; gap:6px; }
  .record-item{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface-2); border-radius:12px; padding:8px 12px; font-size:13px; font-weight:700; color:var(--text); }
  .record-item button{ border:none; background:none; color:var(--text-2); font-size:16px; cursor:pointer; line-height:1; padding:2px 4px; }
  .record-item button:hover{ color:var(--accent); }

  .upload-zone{ border:2px dashed var(--border-strong); border-radius:16px; padding:1.3rem 1rem; text-align:center; color:var(--text-2); font-size:12.5px; font-weight:700; cursor:pointer; background:var(--surface-2); }
  .upload-zone.has-file{ border-color:var(--accent); border-style:solid; color:var(--text); background:color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .month-tabs{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .month-tab{ border:2px solid var(--border); background:var(--surface-2); border-radius:100px; padding:5px 14px; font-size:12px; font-weight:800; color:var(--text-2); cursor:pointer; }
  .month-tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .kv-duo{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:2px; }
  .kv-label{ font-size:11.5px; color:var(--text-2); font-weight:700; }
  .kv-value{ font-family:'Baloo 2', sans-serif; font-size:21px; font-weight:700; color:var(--text); margin-top:4px; }
  .kv-delta{ font-size:11px; font-weight:800; margin-left:6px; }
  .kv-delta.up{ color:#0f9d58; }
  .kv-delta.down{ color:var(--accent); }

  .cat-bar-list{ display:flex; flex-direction:column; gap:11px; margin-top:6px; }
  .cat-bar-top{ display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:5px; }
  .cat-bar-track{ height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:5px; background:var(--accent); }

  .goal-row{ margin-bottom:14px; }
  .goal-row:last-child{ margin-bottom:0; }
  .goal-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px; }
  .goal-name{ font-size:13px; font-weight:700; color:var(--text); }
  .goal-pct{ font-size:12px; font-weight:800; color:var(--accent); flex:none; }
  .goal-track-row{ display:flex; align-items:center; gap:10px; }
  .goal-track-row .mini-bar{ flex:1; }

  .track-stats{ display:flex; gap:16px; font-size:12px; font-weight:700; color:var(--text-2); margin:0 0 14px; flex-wrap:wrap; }
  .track-stats strong{ color:var(--text); }

  .rating-table{ display:flex; flex-direction:column; gap:11px; margin-top:2px; }
  .rating-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .rating-name{ font-size:13px; font-weight:700; color:var(--text); flex:none; width:64px; }
  .rating-dots{ display:flex; gap:6px; }
  .rating-dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--dotcolor); background:transparent; cursor:pointer; padding:0; }
  .rating-dot.filled{ background:var(--dotcolor); }

  .field-label{ font-size:12px; color:var(--text-2); font-weight:700; margin-bottom:6px; }
  .text-input{ width:100%; border:2px solid var(--border); background:var(--surface-2); border-radius:12px; padding:9px 12px; font:inherit; font-size:13px; color:var(--text); resize:vertical; }

  .book-item{ margin-bottom:16px; }
  .book-item:last-child{ margin-bottom:0; }
  .book-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .book-title{ font-size:13.5px; font-weight:700; color:var(--text); }
  .book-author{ font-size:11.5px; color:var(--text-2); font-weight:600; }
  .book-pct{ font-size:12px; font-weight:800; color:var(--accent); flex:none; }
  .book-track-row{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  .book-track-row .mini-bar{ flex:1; }
  .book-meta{ font-size:11px; color:var(--text-2); font-weight:600; margin-top:5px; }

  .stepper-row{ display:flex; align-items:center; gap:12px; }
  .stepper-btn{ width:32px; height:32px; border-radius:10px; border:2px solid var(--border-strong); background:var(--surface-2); color:var(--text); font-weight:800; font-size:16px; cursor:pointer; flex:none; }
  .stepper-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .stepper-value{ font-family:'Baloo 2', sans-serif; font-size:20px; font-weight:700; color:var(--text); min-width:44px; text-align:center; }

  .ritual-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:2px dashed var(--border); }
  .ritual-row:last-child{ border-bottom:none; }
  .ritual-name{ font-size:13px; font-weight:700; color:var(--text); }
  .ritual-btn{ border:2px solid var(--accent); background:transparent; color:var(--accent); font-weight:800; font-size:11.5px; padding:4px 14px; border-radius:100px; cursor:pointer; flex:none; }
  .ritual-btn.done{ background:var(--accent); color:#fff; }

  /* Below this width the sidebar stays fixed and vertical, just narrower: an icon rail. */
  @media (max-width: 640px){
    :root{ --sidebar-w:68px; }
    .sidebar{ padding:16px 8px calc(14px + env(safe-area-inset-bottom,0px)); align-items:center; }
    .brand{ padding:4px 0 14px; }
    .brand-text{ display:none; }
    .nav-label{ display:none; }
    .nav-item{ justify-content:center; padding:10px 0; }
    .nav-item .nav-text{ display:none; }
    .sidebar-foot{ padding-top:12px; width:100%; }
    .foot-stat-label, .foot-stat-value{ display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#bcb0fc"/>
            <stop offset="1" stop-color="#6349f8"/>
          </linearGradient>
        </defs>
        <circle cx="20" cy="20" r="19" fill="url(#brandGrad)"/>
        <path d="M6 23c3-2 5-2 8 0s5 2 8 0 5-2 8 0" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round"/>
        <path d="M6 28c3-2 5-2 8 0s5 2 8 0 5-2 8 0" stroke="#fff" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".55"/>
      </svg>
      <div class="brand-text">
        <div class="name">Ericzin's Life Plan</div>
        <div class="who">painel semanal</div>
      </div>
    </div>

    <div class="nav-label">Início</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var ICONS = {
    overview: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.6 9.4 12.9 12.9 9.4 14.6 11.1 11.1Z"/></svg>',
    saude:   '<svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 2-7 2 2h5"/></svg>',
    sono:    '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>',
    mente:   '<svg viewBox="0 0 24 24"><path d="M12 3c1 3 3 5 6 6-3 1-5 3-6 6-1-3-3-5-6-6 3-1 5-3 6-6Z"/></svg>',
    leitura: '<svg viewBox="0 0 24 24"><path d="M4 5.7C4 5 4.6 4.5 5.5 4.5H11V19H5.5C4.6 19 4 18.5 4 17.8Z"/><path d="M20 5.7c0-.7-.6-1.2-1.5-1.2H13V19h5.5c.9 0 1.5-.5 1.5-1.2Z"/></svg>',
    financas:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2.2"/><path d="M3 10.2h18"/><circle cx="16.4" cy="14.4" r="1.3"/></svg>',
    carreira:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M8.3 8V6.3A1.8 1.8 0 0 1 10.1 4.5h3.8a1.8 1.8 0 0 1 1.8 1.8V8"/><path d="M3 13.3h18"/></svg>'
  };

  /* color = brand purple used in the sidebar/overview. accent = the pillar's own color, used only inside its detail page. */
  var PILLARS = [
    { id:'saude',    icon:'saude',    name:'Saúde & Corpo',    color:'#8570fd', accent:'#1f9d6c', custom:true },
    { id:'sono',     icon:'sono',     name:'Sono & Descanso',  color:'#6349f8', accent:'#e2793d', custom:true },
    { id:'mente',    icon:'mente',    name:'Mente',            color:'#8570fd', accent:'#7c63fb', custom:true },
    { id:'leitura',  icon:'leitura',  name:'Estudo',           color:'#6349f8', accent:'#b8860b', custom:true },
    { id:'financas', icon:'financas', name:'Finanças',         color:'#8570fd', accent:'#9c1f4a', custom:true },
    { id:'carreira', icon:'carreira', name:'Carreira',         color:'#6349f8', accent:'#3a4fd6', custom:true }
  ];

  var WEEKDAYS = [
    { key:'seg', label:'SEG' }, { key:'ter', label:'TER' }, { key:'qua', label:'QUA' },
    { key:'qui', label:'QUI' }, { key:'sex', label:'SEX' }, { key:'sab', label:'SÁB' }, { key:'dom', label:'DOM' }
  ];

  var STORAGE_KEY = 'painelVidaExec';
  var PAGE_KEY = 'painelVidaExecPage';

  /* ---------- Cloud sync (Firebase) ----------
     Paste your web app's Firebase config below (Firebase Console > Project settings > General > Your apps).
     Until a real apiKey is pasted in, or if the Firebase scripts fail to load (e.g. inside a sandboxed
     preview), the app quietly falls back to plain browser localStorage — same as before. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAj6qA0idBpsjv8oR759oVnxYhG72JTwzk",
    authDomain: "ericzinlifeplan.firebaseapp.com",
    projectId: "ericzinlifeplan",
    storageBucket: "ericzinlifeplan.firebasestorage.app",
    messagingSenderId: "394974980536",
    appId: "1:394974980536:web:64f4026de16c9ad880074d"
  };
  var FIRESTORE_COLLECTION = 'paineis';

  var cloudMode = false;
  var cloudUser = null;
  var cloudData = null;
  var cloudSaveTimer = null;

  function cloudConfigured(){
    return typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('COLE_AQUI') === -1;
  }
  function showAuthOverlay(note){
    document.getElementById('authNote').textContent = note || '';
    document.getElementById('authOverlay').hidden = false;
  }
  function hideAuthOverlay(){
    document.getElementById('authOverlay').hidden = true;
  }
  function updateAccountRow(){
    var row = document.getElementById('accountRow');
    if(!cloudMode || !cloudUser){ row.hidden = true; return; }
    row.hidden = false;
    document.getElementById('accountAvatar').src = cloudUser.photoURL || '';
    document.getElementById('accountName').textContent = cloudUser.displayName || cloudUser.email || 'Conta';
  }
  function scheduleCloudSave(){
    if(!cloudMode || !cloudUser || !cloudData) return;
    if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function(){
      firebase.firestore().collection(FIRESTORE_COLLECTION).doc(cloudUser.uid).set(cloudData).catch(function(err){
        console.error('Falha ao sincronizar com a nuvem:', err);
      });
    }, 700);
  }
  function cloudSignIn(){
    var provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider).catch(function(err){
      showAuthOverlay('Não foi possível entrar: ' + err.message);
    });
  }
  function cloudSignOut(){
    firebase.auth().signOut();
  }
  function bootCloud(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
    }catch(e){ render(); return; }
    cloudMode = true;
    document.getElementById('googleSignInBtn').onclick = cloudSignIn;
    document.getElementById('accountSignOut').onclick = cloudSignOut;
    firebase.auth().onAuthStateChanged(function(user){
      cloudUser = user;
      if(user){
        firebase.firestore().collection(FIRESTORE_COLLECTION).doc(user.uid).get().then(function(snap){
          cloudData = snap.exists ? (snap.data() || {}) : {};
          hideAuthOverlay();
          render();
        }).catch(function(err){
          cloudData = {};
          hideAuthOverlay();
          render();
          console.error('Falha ao carregar dados da nuvem:', err);
        });
      } else {
        cloudData = null;
        showAuthOverlay('');
      }
    });
  }

  function loadData(){
    if(cloudMode) return cloudData || {};
    try{
      var stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : {};
    }catch(e){ return {}; }
  }
  function saveData(data){
    if(cloudMode){
      cloudData = data;
      scheduleCloudSave();
      return;
    }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadPage(){
    try{ return localStorage.getItem(PAGE_KEY) || 'overview'; }catch(e){ return 'overview'; }
  }
  function savePage(p){
    try{ localStorage.setItem(PAGE_KEY, p); }catch(e){}
  }

  function isoDate(d){ return d.toISOString().split('T')[0]; }
  function addDays(d, n){ var nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
  function todayIndexMon(){ return (new Date().getDay() + 6) % 7; }
  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  function getWeekKey(d){
    var today = d || new Date();
    var day = today.getDay();
    var diffToMonday = (day === 0) ? -6 : (1 - day);
    var start = new Date(today);
    start.setDate(today.getDate() + diffToMonday);
    return start.toISOString().split('T')[0];
  }
  function formatWeekLabel(iso){
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1];
  }
  function formatToday(){
    var d = new Date();
    return d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  }
  function fmtMoney(n){ return n.toLocaleString('pt-BR'); }
  function monthFullName(k){
    return { jun:'junho', jul:'julho', ago:'agosto', set:'setembro' }[k] || k;
  }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function getCssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#6b7280';
  }
  function calcStreak(markedDates){
    var set = {};
    markedDates.forEach(function(d){ set[d] = true; });
    var cursor = new Date();
    if(!set[isoDate(cursor)]){
      cursor = addDays(cursor, -1);
      if(!set[isoDate(cursor)]) return 0;
    }
    var count = 0;
    while(set[isoDate(cursor)]){ count++; cursor = addDays(cursor, -1); }
    return count;
  }
  function pillarEyebrow(pillarId){
    var idx = PILLARS.findIndex(function(p){ return p.id === pillarId; });
    var p = PILLARS[idx];
    return 'PILAR ' + pad2(idx + 1) + ' · ' + p.name.toUpperCase();
  }
  function pageHeaderHtml(pillar, title, subtitle){
    return '<button class="back-link" id="backBtn">&larr; Visão geral</button>' +
      '<div class="eyebrow" style="color:' + pillar.accent + '">' + pillarEyebrow(pillar.id) + '</div>' +
      '<div class="page-head"><div><h1>' + title + '</h1>' +
      '<div class="page-sub">' + subtitle + '</div></div></div>';
  }

  /* ---------- Saúde & Corpo ---------- */
  function seedSaude(data){
    var wk = getWeekKey();
    data.saude = { weeks:{}, dogWalks:[], records:[
      { id:'r1', text:'Agachamento: 60kg' },
      { id:'r2', text:'5km em 28min' }
    ] };
    data.saude.weeks[wk] = { days:{ seg:true, ter:true, qua:true, qui:true, sex:true, sab:false, dom:false }, meta:5 };
    var counts = [3,4,3,2,5];
    for(var i=5;i>=1;i--){
      var past = addDays(new Date(), -7*i);
      var pk = getWeekKey(past);
      var c = counts[5-i];
      var days = { seg:false, ter:false, qua:false, qui:false, sex:false, sab:false, dom:false };
      var keys = Object.keys(days);
      for(var j=0;j<c;j++) days[keys[j]] = true;
      data.saude.weeks[pk] = { days:days, meta:5 };
    }
    var walks = [];
    for(var k=22;k>=0;k--){ walks.push(isoDate(addDays(new Date(), -k))); }
    data.saude.dogWalks = walks;
  }
  function blankSaudeDays(){ return { seg:false, ter:false, qua:false, qui:false, sex:false, sab:false, dom:false }; }
  function ensureSaude(data){
    if(!data.saude || typeof data.saude !== 'object') seedSaude(data);
    if(!Array.isArray(data.saude.records)) data.saude.records = [];
    if(!Array.isArray(data.saude.dogWalks)) data.saude.dogWalks = [];
    if(!data.saude.weeks || typeof data.saude.weeks !== 'object') data.saude.weeks = {};
    var wk = getWeekKey();
    if(!data.saude.weeks[wk] || !data.saude.weeks[wk].days){
      data.saude.weeks[wk] = { days: blankSaudeDays(), meta:5 };
    }
    return data.saude;
  }

  function saudeDaysCount(wd){
    if(!wd || !wd.days) return 0;
    return WEEKDAYS.filter(function(d){ return wd.days[d.key]; }).length;
  }

  function renderSaudePage(){
    var pillar = PILLARS.find(function(p){ return p.id === 'saude'; });
    var data = loadData();
    ensureSaude(data);
    saveData(data);
    var wk = getWeekKey();
    var weekDoc = data.saude.weeks[wk];
    var meta = weekDoc.meta;
    var daysOn = saudeDaysCount(weekDoc);

    /* Only weeks written by this schema (they carry .days) count toward the history and the record. */
    var weekKeys = Object.keys(data.saude.weeks).filter(function(k){ return data.saude.weeks[k] && data.saude.weeks[k].days; }).sort();
    var last6 = weekKeys.slice(-6);
    var histLabels = last6.map(function(k){ return formatWeekLabel(k); });
    var histValues = last6.map(function(k){ return saudeDaysCount(data.saude.weeks[k]); });
    var recordWeek = weekKeys.reduce(function(max,k){
      return Math.max(max, saudeDaysCount(data.saude.weeks[k]));
    }, 0);

    var dogStreak = calcStreak(data.saude.dogWalks);
    var todayIso = isoDate(new Date());
    var walkedToday = data.saude.dogWalks.indexOf(todayIso) >= 0;

    var main = document.getElementById('main');
    main.innerHTML = pageHeaderHtml(pillar, 'Treino e movimento', 'Marca os dias em que treinou essa semana — a meta e a sequência se atualizam sozinhas.') +
      '<div class="pillar-body" style="--accent:' + pillar.accent + '">' +
        '<div class="detail-grid">' +
          '<div class="card">' +
            '<div class="card-title">Treinos essa semana</div>' +
            '<div class="page-sub" style="margin-top:-8px;margin-bottom:12px;">Seg a dom · toca pra marcar</div>' +
            '<div class="day-toggle-row" id="dayToggleRow"></div>' +
            '<div class="meta-row"><span>Meta da semana</span><strong>' + daysOn + ' / ' + meta + '</strong></div>' +
            '<div class="mini-bar"><div class="mini-bar-fill" style="width:' + Math.min(100, Math.round(daysOn/meta*100)) + '%"></div></div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="chart-card-head"><span>Últimas 6 semanas</span><span>meta ' + meta + ' treinos/semana</span></div>' +
            '<div class="page-sub" style="margin:2px 0 8px;">Treinos concluídos por semana</div>' +
            '<div class="chart-wrap" style="height:168px;"><canvas id="saudeChart"></canvas></div>' +
          '</div>' +
        '</div>' +
        '<div class="stat-duo" style="margin-top:1.1rem;">' +
          '<div class="card stat-number-card clickable" id="dogWalkCard">' +
            '<div class="card-title">Passeio com a cachorra</div>' +
            '<div class="stat-number">' + dogStreak + '</div>' +
            '<div class="stat-number-label">dias seguidos · ' + (walkedToday ? 'já passeou hoje ✓' : 'toca pra marcar hoje') + '</div>' +
          '</div>' +
          '<div class="card stat-number-card">' +
            '<div class="card-title">Recorde de treinos numa semana</div>' +
            '<div class="stat-number">' + recordWeek + '</div>' +
            '<div class="stat-number-label">treinos</div>' +
          '</div>' +
        '</div>' +
        '<div class="card" style="margin-top:1.1rem;">' +
          '<div class="card-title">Recordes pessoais</div>' +
          '<div class="page-sub" style="margin-top:-8px;margin-bottom:12px;">Registre um PR pra acompanhar sua evolução</div>' +
          '<div class="record-add"><input type="text" class="text-input" id="recordInput" placeholder="ex: agachamento 60kg, 5km em 28min..."><button id="recordAddBtn">Adicionar</button></div>' +
          '<div class="record-list" id="recordList"></div>' +
        '</div>' +
      '</div>';

    document.getElementById('backBtn').onclick = function(){ navigate('overview'); };

    var dayRow = document.getElementById('dayToggleRow');
    WEEKDAYS.forEach(function(d, idx){
      var btn = document.createElement('button');
      btn.className = 'day-toggle' + (weekDoc.days[d.key] ? ' on' : '') + (idx === todayIndexMon() ? ' today' : '');
      btn.innerHTML = '<span class="dow">' + d.label + '</span>';
      btn.onclick = function(){
        var dd = loadData(); ensureSaude(dd);
        var wdoc = dd.saude.weeks[getWeekKey()];
        wdoc.days[d.key] = !wdoc.days[d.key];
        saveData(dd);
        renderSaudePage();
      };
      dayRow.appendChild(btn);
    });

    document.getElementById('dogWalkCard').onclick = function(){
      var dd = loadData(); ensureSaude(dd);
      var iso = isoDate(new Date());
      var idx = dd.saude.dogWalks.indexOf(iso);
      if(idx >= 0) dd.saude.dogWalks.splice(idx, 1); else dd.saude.dogWalks.push(iso);
      saveData(dd);
      renderSaudePage();
    };

    var list = document.getElementById('recordList');
    data.saude.records.forEach(function(r){
      var row = document.createElement('div');
      row.className = 'record-item';
      var span = document.createElement('span');
      span.textContent = r.text;
      var btn = document.createElement('button');
      btn.innerHTML = '&times;';
      btn.setAttribute('aria-label', 'Remover');
      btn.onclick = function(){
        var dd = loadData(); ensureSaude(dd);
        dd.saude.records = dd.saude.records.filter(function(x){ return x.id !== r.id; });
        saveData(dd);
        renderSaudePage();
      };
      row.appendChild(span); row.appendChild(btn);
      list.appendChild(row);
    });

    function addSaudeRecord(){
      var input = document.getElementById('recordInput');
      var val = input.value.trim();
      if(!val) return;
      var dd = loadData(); ensureSaude(dd);
      dd.saude.records.push({ id:'r' + Date.now(), text: val });
      saveData(dd);
      renderSaudePage();
    }
    document.getElementById('recordAddBtn').onclick = addSaudeRecord;
    document.getElementById('recordInput').addEventListener('keydown', function(e){ if(e.key === 'Enter') addSaudeRecord(); });

    setTimeout(function(){
      var ctx = document.getElementById('saudeChart');
      if(!ctx) return;
      new Chart(ctx, {
        data:{ labels: histLabels, datasets:[
          { type:'bar', label:'Treinos', data: histValues, backgroundColor: pillar.accent, borderRadius:6, maxBarThickness:30 },
          { type:'line', label:'Meta', data: histLabels.map(function(){ return meta; }), borderColor: getCssVar('--text-2'), borderDash:[5,5], pointRadius:0, borderWidth:1.5 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
          scales:{ y:{ beginAtZero:true, max:7, ticks:{ stepSize:1, color:getCssVar('--text-2') }, grid:{ color:getCssVar('--border') } },
                   x:{ ticks:{ color:getCssVar('--text-2') }, grid:{ display:false } } } }
      });
    }, 50);
  }

  /* ---------- Sono & Descanso ---------- */
  function seedSonoWeek(){
    return { hours:{ seg:7, ter:6.5, qua:7, qui:7, sex:6.5, sab:8.5, dom:7 }, energy:3, rituals:{ tela:true, diario:false, cafeina:true } };
  }
  function ensureSono(data){
    if(!data.sono || typeof data.sono !== 'object') data.sono = {};
    if(!data.sono.weeks || typeof data.sono.weeks !== 'object') data.sono.weeks = {};
    var wk = getWeekKey();
    if(!data.sono.weeks[wk] || !data.sono.weeks[wk].hours) data.sono.weeks[wk] = seedSonoWeek();
    return data.sono;
  }

  function renderSonoPage(){
    var pillar = PILLARS.find(function(p){ return p.id === 'sono'; });
    var data = loadData();
    ensureSono(data);
    saveData(data);
    var wk = getWeekKey();
    var wd = data.sono.weeks[wk];
    var meta = 8;
    var todayKey = WEEKDAYS[todayIndexMon()].key;
    var hoursArr = WEEKDAYS.map(function(d){ return wd.hours[d.key]; });
    var avg = hoursArr.reduce(function(s,v){ return s+v; },0) / hoursArr.length;
    var nights7 = hoursArr.filter(function(v){ return v >= 7; }).length;

    var rituals = [
      { id:'tela', name:'Sem tela 30 min antes de dormir' },
      { id:'diario', name:'Diário antes de dormir' },
      { id:'cafeina', name:'Sem cafeína depois das 17h' }
    ];

    var main = document.getElementById('main');
    main.innerHTML = pageHeaderHtml(pillar, 'Quanto você tá descansando', 'Horas de sono por noite e os rituais que ajudam a dormir melhor.') +
      '<div class="pillar-body" style="--accent:' + pillar.accent + '">' +
        '<div class="card">' +
          '<div class="chart-card-head"><span>Horas de sono</span><span>média: ' + avg.toFixed(1) + 'h</span></div>' +
          '<div class="page-sub" style="margin:2px 0 8px;">Seg a dom · meta ' + meta + 'h</div>' +
          '<div class="chart-wrap" style="height:168px;"><canvas id="sonoChart"></canvas></div>' +
          '<div class="stepper-row" style="margin-top:14px;">' +
            '<span class="field-label" style="margin:0;">Hoje</span>' +
            '<button class="stepper-btn" id="hoursMinus">&minus;</button>' +
            '<span class="stepper-value" id="hoursValue">' + wd.hours[todayKey] + 'h</span>' +
            '<button class="stepper-btn" id="hoursPlus">+</button>' +
          '</div>' +

  /* ---------- Estudo (Leitura) ---------- */
  function seedLeitura(data){
    var vals = [8,14,10,16,9,11,13,9,11,13,12,17,16,24];
    var pages = {};
    for(var i=0;i<14;i++){ pages[isoDate(addDays(new Date(), -(13-i)))] = vals[i]; }
    data.leitura = {
      dailyPages: pages,
      books: [
        { id:'b1', title:'Essencialismo', author:'Greg McKeown', totalPages:260, pagesRead:210 },
        { id:'b2', title:'O Poder do Hábito', author:'Charles Duhigg', totalPages:320, pagesRead:80 }
      ]
    };
  }
  function ensureLeitura(data){
    if(!data.leitura || typeof data.leitura !== 'object' || !data.leitura.dailyPages || !Array.isArray(data.leitura.books)) seedLeitura(data);
    return data.leitura;
  }

  function renderLeituraPage(){
    var pillar = PILLARS.find(function(p){ return p.id === 'leitura'; });
    var data = loadData();
    ensureLeitura(data);
    saveData(data);
    var meta = 15;
    var today = new Date();
    var todayIso = isoDate(today);

    var last7 = []; for(var i=6;i>=0;i--) last7.push(addDays(today, -i));
    var streak = calcStreak(Object.keys(data.leitura.dailyPages).filter(function(k){ return data.leitura.dailyPages[k] >= meta; }));

    var last14 = []; for(var j=13;j>=0;j--) last14.push(addDays(today, -j));
    var chartLabels = last14.map(function(d){ return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1); });
    var chartValues = last14.map(function(d){ return data.leitura.dailyPages[isoDate(d)] || 0; });
    var todayPages = data.leitura.dailyPages[todayIso] || 0;
    var nonzero = chartValues.filter(function(v){ return v > 0; });
    var avgPace = nonzero.length ? Math.round(nonzero.reduce(function(s,v){ return s+v; },0) / nonzero.length) : meta;

    var main = document.getElementById('main');
    main.innerHTML = pageHeaderHtml(pillar, 'Leitura e aprendizados', 'A meta de 15 páginas por dia e os livros que você está lendo agora.') +
      '<div class="pillar-body" style="--accent:' + pillar.accent + '">' +
        '<div class="detail-grid">' +
          '<div class="card">' +
            '<div class="card-title">15 páginas por dia</div>' +
            '<div class="page-sub" style="margin-top:-8px;margin-bottom:12px;">Últimos 7 dias · toca pra marcar</div>' +
            '<div class="day-toggle-row" id="readToggleRow"></div>' +
            '<div class="meta-row"><span>Sequência atual</span><strong>' + streak + ' dia' + (streak===1?'':'s') + '</strong></div>' +
            '<div class="mini-bar"><div class="mini-bar-fill" style="width:' + Math.min(100, Math.round(streak/7*100)) + '%"></div></div>' +
            '<div class="field-label" style="margin-top:16px;">Páginas de hoje (ajuste fino, opcional)</div>' +
            '<input type="number" min="0" class="text-input" id="todayPagesInput" value="' + todayPages + '">' +
          '</div>' +
          '<div class="card">' +
            '<div class="chart-card-head"><span>Páginas lidas · últimos 14 dias</span><span>meta ' + meta + ' páginas/dia</span></div>' +
            '<div class="page-sub" style="margin:2px 0 8px;">Linha pontilhada = meta diária · hoje: ' + todayPages + '</div>' +
            '<div class="chart-wrap" style="height:168px;"><canvas id="leituraChart"></canvas></div>' +
          '</div>' +
        '</div>' +
        '<div class="card" style="margin-top:1.1rem;">' +
          '<div class="card-title">Livros sendo lidos</div>' +
          '<div class="page-sub" style="margin-top:-8px;margin-bottom:14px;">Toca em "+10 páginas" conforme for avançando</div>' +
          '<div id="bookList"></div>' +
        '</div>' +
      '</div>';

    document.getElementById('backBtn').onclick = function(){ navigate('overview'); };

    var row = document.getElementById('readToggleRow');
    last7.forEach(function(d, idx){
      var iso = isoDate(d);
      var on = (data.leitura.dailyPages[iso] || 0) >= meta;
      var isToday = iso === todayIso;
      var label = isToday ? 'HOJE' : ('D-' + (6-idx));
      var btn = document.createElement('button');
      btn.className = 'day-toggle' + (on ? ' on' : '') + (isToday ? ' today' : '');
      btn.innerHTML = '<span class="dow">' + label + '</span>';
      btn.onclick = function(){
        var dd = loadData(); ensureLeitura(dd);
        var cur = dd.leitura.dailyPages[iso] || 0;
        dd.leitura.dailyPages[iso] = cur >= meta ? 0 : meta;
        saveData(dd);
        renderLeituraPage();
      };
      row.appendChild(btn);
    });

    document.getElementById('todayPagesInput').addEventListener('change', function(e){
      var v = Math.max(0, parseInt(e.target.value, 10) || 0);
      var dd = loadData(); ensureLeitura(dd);
      dd.leitura.dailyPages[todayIso] = v;
      saveData(dd);
      renderLeituraPage();
    });

    var bookList = document.getElementById('bookList');
    data.leitura.books.forEach(function(b){
      var pct = Math.min(100, Math.round(b.pagesRead / b.totalPages * 100));
      var remaining = Math.max(0, b.totalPages - b.pagesRead);
      var days = remaining <= 0 ? 0 : Math.max(1, Math.ceil(remaining / avgPace));
      var item = document.createElement('div');
      item.className = 'book-item';
      item.innerHTML =
        '<div class="book-top"><div><div class="book-title">' + escapeHtml(b.title) + '</div><div class="book-author">' + escapeHtml(b.author) + '</div></div><div class="book-pct">' + pct + '%</div></div>' +
        '<div class="book-track-row"><div class="mini-bar"><div class="mini-bar-fill" style="width:' + pct + '%"></div></div><button class="boost-btn">+10 páginas</button></div>' +
        '<div class="book-meta">' + (remaining > 0 ? ('faltam ' + remaining + ' páginas · ~' + days + ' dia' + (days===1?'':'s') + ' no ritmo atual') : 'concluído! 🎉') + '</div>';
      item.querySelector('.boost-btn').onclick = function(){
        var dd = loadData(); ensureLeitura(dd);
        var book = dd.leitura.books.find(function(x){ return x.id === b.id; });
        book.pagesRead = Math.min(book.totalPages, book.pagesRead + 10);
        saveData(dd);
        renderLeituraPage();
      };
      bookList.appendChild(item);
    });

    setTimeout(function(){
      var ctx = document.getElementById('leituraChart');
      if(!ctx) return;
      new Chart(ctx, {
        data:{ labels: chartLabels, datasets:[
          { type:'bar', label:'Páginas', data: chartValues, backgroundColor: pillar.accent, borderRadius:5, maxBarThickness:18 },
          { type:'line', label:'Meta', data: chartLabels.map(function(){ return meta; }), borderColor: getCssVar('--text-2'), borderDash:[5,5], pointRadius:0, borderWidth:1.5 }
        ]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } },
          scales:{ y:{ beginAtZero:true, ticks:{ color:getCssVar('--text-2') }, grid:{ color:getCssVar('--border') } },
                   x:{ ticks:{ color:getCssVar('--text-2'), maxRotation:0, autoSkip:true, font:{ size:9 } }, grid:{ display:false } } } }
      });
    }, 50);
  }

        '</div>' +
      '</div>';

    document.getElementById('backBtn').onclick = function(){ navigate('overview'); };

    [['menteCheckin','checkin'], ['menteGood','goodThing'], ['menteInsights','insights']].forEach(function(pair){
      document.getElementById(pair[0]).addEventListener('input', function(e){
        var dd = loadData(); ensureMente(dd, wk);
        dd.mente.weeks[wk][pair[1]] = e.target.value;
        saveData(dd);
      });
    });

    var table = document.getElementById('ratingTable');
    ratingTargets.forEach(function(rt){
      var targetPillar = PILLARS.find(function(p){ return p.id === rt.id; });
      var current = doc.ratings[rt.id] || 0;
      var row = document.createElement('div');
      row.className = 'rating-row';
      row.style.setProperty('--dotcolor', targetPillar.accent);
      var dotsWrap = document.createElement('div');
      dotsWrap.className = 'rating-dots';
      for(var i=1;i<=5;i++){
        (function(val){
          var dot = document.createElement('button');
          dot.className = 'rating-dot' + (val <= current ? ' filled' : '');
          dot.setAttribute('aria-label', 'Nota ' + val);
          dot.onclick = function(){
            var dd = loadData(); ensureMente(dd, wk);
            var cur = dd.mente.weeks[wk].ratings[rt.id] || 0;
            dd.mente.weeks[wk].ratings[rt.id] = (cur === val) ? 0 : val;
            saveData(dd);
            renderMentePage();
          };
          dotsWrap.appendChild(dot);
        })(i);
      }
      var nameSpan = document.createElement('span');
      nameSpan.className = 'rating-name';
      nameSpan.textContent = rt.name;
      row.appendChild(nameSpan);
      row.appendChild(dotsWrap);
      table.appendChild(row);
    });
  }

  /* ---------- Overview ---------- */
  function getPillarWeekSummary(pillar, data, weekKey){
    switch(pillar.id){
      case 'sono': {
        ensureSono(data);
        var wdS = data.sono.weeks[weekKey];
        var hoursArrS = WEEKDAYS.map(function(d){ return wdS.hours[d.key]; });
        var avgS = hoursArrS.reduce(function(s,v){ return s+v; },0) / hoursArrS.length;
        var nights7S = hoursArrS.filter(function(v){ return v >= 7; }).length;
        return { percent: Math.round(nights7S/7*100), metric: avgS.toFixed(1) + 'h de média · ' + nights7S + '/7 noites com 7h+' };
      }
      case 'saude': {
        ensureSaude(data);
        var wd = data.saude.weeks[weekKey];
        var days = saudeDaysCount(wd);
        return { percent: Math.min(100, Math.round(days/wd.meta*100)), metric: days + '/' + wd.meta + ' dias de treino' };
      }
      case 'financas': {
        ensureFinancas(data);
        var goals = data.financas.goals;
        var avgF = Math.round(goals.reduce(function(s,g){ return s+g.progress; },0) / goals.length);
        return { percent: avgF, metric: avgF + '% das metas de longo prazo' };
      }
      case 'carreira': {
        ensureCarreira(data);
        var allP = data.carreira.tracks.reduce(function(a,t){ return a.concat(t.projects); }, []);
        var avgC = Math.round(allP.reduce(function(s,p){ return s+p.progress; },0) / allP.length);
        return { percent: avgC, metric: avgC + '% do plano de ação' };
      }
      case 'mente': {
        ensureMente(data, weekKey);
        var ratings = data.mente.weeks[weekKey].ratings;
        var vals = Object.keys(ratings).map(function(k){ return ratings[k]; }).filter(function(v){ return v > 0; });
        if(!vals.length) return { percent:0, metric:'ainda sem check-in essa semana' };
        var avgM = vals.reduce(function(s,v){ return s+v; },0) / vals.length;
        return { percent: Math.round(avgM/5*100), metric:'nota média ' + avgM.toFixed(1) + '/5' };
      }
      case 'leitura': {
        ensureLeitura(data);
        var streak = calcStreak(Object.keys(data.leitura.dailyPages).filter(function(k){ return data.leitura.dailyPages[k] >= 15; }));
        return { percent: Math.min(100, Math.round(streak/7*100)), metric: streak + ' dia' + (streak===1?'':'s') + ' de sequência' };
      }
      default:
        return { percent:0, metric:'—' };
    }
  }

  function computeOverviewStats(data, weekKey){
    var onTrack = 0, totalProgress = 0;
    var perPillar = PILLARS.map(function(p){
      var s = getPillarWeekSummary(p, data, weekKey);
      if(s.percent >= 70) onTrack++;
      totalProgress += s.percent;
      return { pillar:p, progress:s.percent, metric:s.metric };
    });
    saveData(data);
    return { onTrack:onTrack, consistency: Math.round(totalProgress / PILLARS.length), perPillar: perPillar };
  }

  function updateSidebarFooter(){
    var data = loadData();
    var stats = computeOverviewStats(data, getWeekKey());
    document.getElementById('footConsistency').textContent = stats.consistency + '%';
    document.getElementById('footBar').style.width = stats.consistency + '%';
  }

  function renderOverview(){
    var data = loadData();
    var weekKey = getWeekKey();
    var stats = computeOverviewStats(data, weekKey);

    var main = document.getElementById('main');
    main.innerHTML =
      '<div class="eyebrow">Visão geral</div>' +
      '<div class="page-head">' +
        '<div><h1>Ericzin\'s Life Plan</h1>' +
        '<div class="page-sub">Seis pilares, um plano de ação e uma evolução pra acompanhar em cada um. Clique num cartão pra abrir o pilar.</div></div>' +
      '</div>' +
      '<div class="hero-card">' +
        '<div><div class="hero-label">Pilares em dia esta semana</div>' +
        '<div class="hero-value">' + stats.onTrack + '<span class="of"> / ' + PILLARS.length + '</span></div></div>' +
        '<div class="hero-meta"><div class="date">' + capitalize(formatToday()) + '</div>' +
        'semana em andamento<br><span class="hero-chip">' + stats.consistency + '% de consistência</span></div>' +
      '</div>' +
      '<div class="grid" id="overviewGrid"></div>';

    var grid = document.getElementById('overviewGrid');
    stats.perPillar.forEach(function(row){
      var p = row.pillar;
      var card = document.createElement('button');
      card.className = 'pillar-card';
      card.style.setProperty('--accent', p.color);
      card.onclick = function(){ navigate(p.id); };
      card.innerHTML =
        '<div class="pillar-top">' +
          '<div class="pillar-ico">' + ICONS[p.icon] + '</div>' +
          '<div class="pillar-name">' + p.name + '</div>' +
        '</div>' +
        '<div class="pillar-metric">' + row.metric + '</div>' +
        '<div class="pillar-bar"><div class="pillar-bar-fill" style="width:' + row.progress + '%"></div></div>';
      grid.appendChild(card);
    });
  }

  /* ---------- routing / sidebar ---------- */
  var state = { page: loadPage() };

  function navigate(page){
    state.page = page;
    savePage(page);
    render();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function buildSidebar(){
    var navOverview = document.getElementById('navOverview');
    var navPillars = document.getElementById('navPillars');
    navOverview.innerHTML = '';
    navPillars.innerHTML = '';

    var ovBtn = document.createElement('button');
    ovBtn.className = 'nav-item' + (state.page === 'overview' ? ' active' : '');
    ovBtn.title = 'Visão geral';
    ovBtn.innerHTML = '<span class="ico">' + ICONS.overview + '</span><span class="nav-text">Visão geral</span>';
    ovBtn.onclick = function(){ navigate('overview'); };
    navOverview.appendChild(ovBtn);

    PILLARS.forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'nav-item' + (state.page === p.id ? ' active' : '');
      btn.title = p.name;
      btn.innerHTML = '<span class="ico" style="color:' + p.color + '">' + ICONS[p.icon] + '</span><span class="nav-text">' + p.name + '</span>';
      btn.onclick = function(){ navigate(p.id); };
      navPillars.appendChild(btn);
    });
  }

  function renderPillarOrOverview(){
    if(state.page === 'overview'){ renderOverview(); return; }
    var p = PILLARS.find(function(x){ return x.id === state.page; });
    if(!p){ state.page = 'overview'; renderOverview(); return; }
    if(p.id === 'saude') renderSaudePage();
    else if(p.id === 'sono') renderSonoPage();
    else if(p.id === 'financas') renderFinancasPage();
    else if(p.id === 'carreira') renderCarreiraPage();
    else if(p.id === 'mente') renderMentePage();
    else if(p.id === 'leitura') renderLeituraPage();
  }

  function render(){
    buildSidebar();
    updateAccountRow();
    try{
      renderPillarOrOverview();
    }catch(err){
      document.getElementById('main').innerHTML =
        '<div class="card"><div class="card-title" style="color:var(--primary-hover);">Algo deu errado ao abrir esta página</div>' +
        '<div class="page-sub">Tenta clicar em "Visão geral" e abrir de novo. Detalhe técnico: ' + escapeHtml(String(err && err.message || err)) + '</div></div>';
    }
    updateSidebarFooter();
  }

  if(cloudConfigured()){ bootCloud(); } else { render(); }
})();
</script>
</body>
</html>
